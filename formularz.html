<!DOCTYPE html>
<html lang="pl">
<head>
    <link rel = "stylesheet" href = "style.css">
    <meta charset="UTF-8">
    <title>Formularz danych</title>
</head>
<body>
<h1> Formularz </h1>
<div class = "container">
<form>
<label for="imie">Imię:</label><br>
<input type = "text" id ="imie" name = "imie" placeholder="Podaj swoje imię"><br><br>
<label for="nazwisko">Nazwisko:</label><br>
<input type = "text" id ="nazwisko" name = "nazwisko" placeholder="Podaj swoje nazwisko"><br><br>
<label for="ulica">Ulica:</label><br>
<input type = "text" id ="ulica" name = "ulica" placeholder="Podaj ulice na której mieszkasz"><br><br>
<label for="miasto">Miasto:</label><br>
<input type = "text" id ="miasto" name = "miasto" placeholder="Podaj miasto w którym mieszkasz"><br><br>
<label for="haslo">Hasło:</label><br>
<input type = "password" id ="haslo" name = "haslo" placeholder="Podaj hasło"><br><br>
<label for="data">Data urodzenia:</label><br>
<input type = "date" id ="data" name = "data" placeholder="Podaj date urodzenia"><br><br>
<label for="telefon">Telefon:</label><br>
<input type = "tel" id ="telefon" name = "telefon" placeholder="Podaj nr telefonu"><br><br>
<label for="wojewodztwo">Województwo:</label><br>
<select id="wojewodztwo" name="wojewodztwo">
<option value="">Wybierz województwo</option>
<option value="dolnoslaskie">Dolnośląskie</option>
<option value="kujawsko-pomorskie">Kujawsko-pomorskie</option>
<option value="lubelskie">Lubelskie</option>
<option value="lubuskie">Lubuskie</option>
<option value="lodzkie">Łódzkie</option>
<option value="malopolskie">Małopolskie</option>
<option value="mazowieckie">Mazowieckie</option>           
<option value="opolskie">Opolskie</option>
<option value="podkarpackie">Podkarpackie</option>
<option value="podlaskie">Podlaskie</option>
<option value="pomorskie">Pomorskie</option>
<option value="slaskie">Śląskie</option>            
<option value="swietokrzyskie">Świętokrzyskie</option> 
<option value="warminsko-mazurskie">Warmińsko-mazurskie</option>           
<option value="wielkopolskie">Wielkopolskie</option>            
<option value="zachodniopomorskie">Zachodniopomorskie</option>
</select><br><br>
<label for="Email">Email:</label><br>
<input type = "email" id ="Email" name = "Email" placeholder="Podaj email"><br><br>
<label for="uwagi">Uwagi:</label><br>
<input type = "text" id ="uwagi" name = "uwagi" placeholder="Wpisz uwagi"><br><br>
<label for="prawojazdy">Czy posiadasz prawo jazdy?:</label><br>
<input type = "checkbox" id ="prawojazdy" name = "prawojazdy" value = "tak"><br><br>
<input type = "submit" value = "Wyślij">
<input type = "reset" value = "Zresetuj">
</form>
</div>
</body>
