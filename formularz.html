<!DOCTYPE html>
<html lang="pl">
<head>
    <link rel = "stylesheet" href = "style.css">
    <meta charset="UTF-8">
    <title>Formularz danych</title>
</head>
<body>
<h1> Formularz </h1>
<div class = "container">
<form>
<label for="imie">Imię:</label><br>
<input type = "text" id ="imie" name = "imie" placeholder="Podaj swoje imię"
    required
    pattern="[A-ZĄĆĘŁŃÓŚŹŻ][a-ząćęłńóśźż]+"
    title="Imię musi zaczynać się z wielkiej litery i zawierać tylko litery"><br><br>
<label for="nazwisko">Nazwisko:</label><br>
<input type="text" id="nazwisko" name="nazwisko" placeholder="Podaj swoje nazwisko" minlength="2" maxlength="50" required pattern="[A-ZĄĆĘŁŃÓŚŹŻ][a-ząćęłńóśźż]+(-[A-ZĄĆĘŁŃÓŚŹŻ][a-ząćęłńóśźż]+)?" title="Nazwisko musi zaczynać się z wielkiej litery, zawierać tylko litery. W przypadku nazwisk dwuczłonowych - użyj myślnika, np Kowalska-Nowak"><br><br>
<label for="ulica">Ulica:</label><br>
<input type="text" id="ulica" name="ulica" placeholder="Podaj ulicę, na której mieszkasz" minlength="2" maxlength="50" required pattern="[A-ZĄĆĘŁŃÓŚŹŻ0-9][a-zA-ZĄĆĘŁŃÓŚŹŻąćęłńóśźż0-9\s\.\-\/]+" title="Nazwa ulicy musi zaczynać się od wielkiej litery lub cyfry"><br><br>
<label for="miasto">Miasto:</label><br>
<input type = "text" id ="miasto" name = "miasto" placeholder="Podaj miasto w którym mieszkasz" minlength = "2" maxlength = "30" required pattern = "^([A-ZĄĆĘŁŃÓŚŹŻ])[a-zA-ZĄĆĘŁŃÓŚŹŻąćęłńóśźż\s\-]+" title = "Nazwa miasta musi zaczynać się od dużej litery"><br><br>
<label for="haslo">Hasło:</label><br>
<input type = "password" id ="haslo" name = "haslo" placeholder="Podaj hasło" required pattern = ".{8,} title="Haslo musi miec conajmniej 8 znaków"><br><br>
<label for="data">Data urodzenia:</label><br>
<input type = "date" id ="data" name = "data" placeholder="Podaj date urodzenia" required title = "To pole jest obowiązkowe. Podaj date urodzenia"><br><br>
<label for="telefon">Telefon:</label><br>
<input type="tel" id="telefon" name="telefon" placeholder="Podaj nr telefonu z kierunkowym" required pattern="\+[0-9]{1,3}[\s\-]?([0-9][\s\-]?){7,11}" title="Podaj numer z kierunkowym, np. +48 123 456 789"><br><br>
<label for="wojewodztwo">Województwo:</label><br>
<select id="wojewodztwo" name="wojewodztwo" required>
<option value="">Wybierz województwo</option>
<option value="dolnoslaskie">Dolnośląskie</option>
<option value="kujawsko-pomorskie">Kujawsko-pomorskie</option>
<option value="lubelskie">Lubelskie</option>
<option value="lubuskie">Lubuskie</option>
<option value="lodzkie">Łódzkie</option>
<option value="malopolskie">Małopolskie</option>
<option value="mazowieckie">Mazowieckie</option>           
<option value="opolskie">Opolskie</option>
<option value="podkarpackie">Podkarpackie</option>
<option value="podlaskie">Podlaskie</option>
<option value="pomorskie">Pomorskie</option>
<option value="slaskie">Śląskie</option>            
<option value="swietokrzyskie">Świętokrzyskie</option> 
<option value="warminsko-mazurskie">Warmińsko-mazurskie</option>           
<option value="wielkopolskie">Wielkopolskie</option>            
<option value="zachodniopomorskie">Zachodniopomorskie</option>
</select><br><br>
<label for="Email">Email:</label><br>
<input type = "email" id ="Email" name = "Email" placeholder="Podaj email" required title = "Email musi zawierać znak @"><br><br>
<label for="uwagi">Uwagi:</label><br>
<textarea id="uwagi" name="uwagi" placeholder = "Wpisz uwagi"></textarea><br><br>
<label for="prawojazdy">Czy posiadasz prawo jazdy?:</label><br>
<input type = "checkbox" id ="prawojazdy" name = "prawojazdy" value = "tak"><br><br>
<input type = "submit" value = "Wyślij">
<input type = "reset" value = "Zresetuj">
</form>
</div>
</body>
